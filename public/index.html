<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Promethean CCaaS Training</title>
  <link rel="icon" href="data:," />
  <style>
    :root { --ink: #1f2328; --muted: #5d6670; --line: #dfe3e8; --brand: #1b2a41; --accent: #0f6cbd; --ok: #107c41; --warm: #fff8e1; }
    html, body, #root { height: 100%; }
    body { margin: 0; font-family: "Segoe UI", system-ui, sans-serif; font-size: 14px; color: var(--ink); background: #f3f4f6; }
    .training { display: flex; flex-direction: column; height: 100%; background: #f3f4f6; }

    .training-header { display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: center; justify-content: space-between; padding: 8px 16px; background: var(--brand); color: #fff; }
    .training-brand { display: flex; align-items: baseline; gap: 12px; }
    .training-brand strong { font-size: 16px; }
    .training-brand span { color: #b8c4d6; font-size: 13px; }
    .training-env { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 13px; }
    .training-sim { padding: 2px 10px; border-radius: 10px; background: #f2c14e; color: var(--brand); font-weight: 600; }
    .training-env button { font: inherit; padding: 3px 10px; border-radius: 4px; border: 1px solid #8a9bb5; background: transparent; color: #fff; cursor: pointer; }
    .training-env button:hover { background: #2c4166; }
    .training-message { display: flex; justify-content: space-between; padding: 6px 16px; background: var(--warm); border-bottom: 1px solid #ecdca8; }
    .training-message button { border: 0; background: none; font-size: 16px; cursor: pointer; }

    .training-body { flex: 1; display: flex; min-height: 0; }
    .lesson { width: 330px; flex: none; overflow: auto; padding: 16px 18px; background: #fff; border-right: 1px solid var(--line); }
    .lesson-eyebrow { margin: 0; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
    .lesson-title { margin: 4px 0 10px; font-size: 22px; font-weight: 600; }
    .lesson-progress { height: 6px; border-radius: 3px; background: #e8ebef; overflow: hidden; }
    .lesson-progress div { height: 100%; background: var(--ok); transition: width .3s; }
    .lesson-toggle { margin: 10px 0 0; padding: 0; border: 0; background: none; color: var(--accent); cursor: pointer; font: inherit; font-size: 13px; }
    .lesson-story { margin-top: 6px; padding: 4px 12px; border-left: 3px solid #f2c14e; background: #fffbea; }
    .lesson-story p { margin: 8px 0; line-height: 1.45; }
    .lesson-tasks { list-style: none; margin: 16px 0 0; padding: 0; }
    .lesson-tasks > li { margin-bottom: 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 6px; }
    .lesson-tasks > li.done { background: #f1f8f3; border-color: #cfe6d6; }
    .lesson-tasks > li.current { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
    .lesson-tasks > li.todo { color: var(--muted); }
    .lesson-task-title { display: flex; gap: 8px; font-weight: 600; }
    .lesson-mark { flex: none; width: 18px; height: 18px; border-radius: 50%; border: 2px solid #b9c0c8; font-size: 12px; line-height: 14px; text-align: center; color: #fff; box-sizing: border-box; }
    li.done .lesson-mark { background: var(--ok); border-color: var(--ok); }
    li.current .lesson-mark { border-color: var(--accent); }
    .lesson-done { margin: 6px 0 0 26px; color: #2c5e3b; font-size: 13px; }
    .lesson-current { margin: 6px 0 0 26px; }
    .lesson-current p { margin: 0 0 8px; line-height: 1.45; }
    .lesson-note { margin: 6px 0 0 26px; color: #5d6670; font-size: 13px; }
    .lesson-problem { padding: 6px 8px; background: #fff4ce; border-left: 3px solid #c19c00; border-radius: 4px; font-size: 13px; }
    .lesson-hint { padding: 6px 8px; background: #eef5fc; border-radius: 4px; font-size: 13px; }
    .lesson-actions { display: flex; flex-wrap: wrap; gap: 6px; }
    .lesson-finished { padding: 12px; border-radius: 6px; background: #e6f4ea; line-height: 1.45; }

    .workspace { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .workspace-tabs { padding: 4px 12px 0; background: #fff; border-bottom: 1px solid var(--line); }
    .workspace-view { flex: 1; min-height: 0; position: relative; }
    .workspace-pane { position: absolute; inset: 0; overflow: auto; }
    .workspace-pane[hidden] { display: none; }
    .workspace-diagram { width: 100%; height: 100%; border: 0; background: #fff; }

    .admin { display: flex; flex-direction: column; min-height: 100%; background: #faf9f8; }
    .admin-banner { padding: 6px 16px; background: #fff4ce; border-bottom: 1px solid #f0d989; font-size: 13px; }
    .admin-body { flex: 1; display: flex; }
    .admin-sitemap { width: 200px; flex: none; padding: 12px 8px; background: #fff; border-right: 1px solid var(--line); }
    .admin-group { padding: 6px 10px; font-size: 12px; font-weight: 600; color: var(--muted); }
    .admin-nav { display: block; width: 100%; text-align: left; padding: 7px 10px; border: 0; border-radius: 4px; background: none; font: inherit; cursor: pointer; }
    .admin-nav:hover { background: #f0f2f4; }
    .admin-nav.active { background: #e6eef8; font-weight: 600; box-shadow: inset 3px 0 0 var(--accent); }
    .admin-main { flex: 1; min-width: 0; padding: 12px 24px 24px; }
    .admin-crumbs { font-size: 13px; color: var(--muted); margin-bottom: 8px; }
    .admin-crumb-sep { margin: 0 6px; }
    .admin-title { margin: 6px 0 12px; font-size: 20px; font-weight: 600; }
    .admin-subtitle { margin: 0 0 8px; font-size: 15px; font-weight: 600; }
    .admin-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .admin-card { margin-bottom: 12px; padding: 14px 16px; background: #fff; border: 1px solid var(--line); border-radius: 6px; }
    .admin-muted { color: var(--muted); }
    .admin-link { padding: 0; border: 0; background: none; color: var(--accent); cursor: pointer; font: inherit; text-align: left; }
    .admin-link:hover { text-decoration: underline; }
    .admin-list { margin: 0; padding-left: 18px; columns: 2; }
    .admin-form { display: flex; flex-direction: column; gap: 12px; }
    .export-files { list-style: none; padding: 0; margin: 12px 0; }
    .export-files li { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 6px 0; border-bottom: 1px solid var(--line); }
    .export-subtitle { font-size: 14px; margin: 16px 0 4px; }
    .export-notes { margin: 0; padding-left: 18px; font-size: 13px; }
    .export-muted { color: #616161; font-size: 12px; margin-top: 12px; }
    .admin-apps { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
    .admin-app { text-align: left; padding: 4px 8px; border: 1px solid var(--line); border-radius: 6px; background: #fff; font: inherit; font-size: 12px; cursor: pointer; }
    .admin-app.active { border-color: var(--accent); color: var(--accent); font-weight: 600; }
    .admin-pairs { margin: 4px 0; padding-left: 18px; line-height: 1.6; }
    .admin-pair { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; margin-bottom: 8px; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
    .admin-pair > .fui-Field { min-width: 180px; }
    .admin-inline { justify-content: flex-start; gap: 8px; align-items: flex-end; }
    .admin-choices { display: flex; flex-wrap: wrap; gap: 4px 16px; }
    .admin-number { margin: 4px 0; font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .admin-condition { display: flex; align-items: center; gap: 8px; }
    .admin-info { margin-left: 4px; padding: 0; border: 0; background: none; color: var(--accent); cursor: pointer; font-size: 14px; }
    .admin-search { width: 100%; margin-bottom: 8px; }
    .admin-userlist { display: flex; flex-direction: column; max-height: 60vh; overflow: auto; }
    .admin-drawer-actions { justify-content: flex-end; margin-top: 12px; }

    .admin-nav:disabled { color: #8a9099; cursor: default; background: none; }
    .admin-commands { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; margin: 0 -24px 10px; padding: 4px 16px; background: #fff; border-bottom: 1px solid var(--line); }
    .admin-command-search { margin-left: auto; width: 220px; }
    .admin-notice { margin: 0 -24px; padding: 6px 24px; background: #fff8e1; border-bottom: 1px solid #f0d989; font-size: 13px; }
    .admin-facts { display: flex; gap: 0; }
    .admin-facts div { display: flex; flex-direction: column; padding: 0 16px; border-left: 1px solid var(--line); }
    .admin-facts span { font-size: 12px; color: var(--muted); }
    .admin-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; }
    .admin-tag { margin-left: 4px; padding: 1px 6px; border-radius: 3px; background: #3b3a39; color: #fff; font-size: 11px; font-weight: 400; }
    .admin-optional { margin-left: 6px; font-size: 12px; font-weight: 400; color: var(--muted); }
    .admin-tight { margin: 2px 0 0; }
    .admin-small { font-size: 12px; }
    .admin-right { text-align: right; margin: 6px 0 0; }
    .admin-card-commands { margin: 8px 0; }
    .admin-check { width: 40px; }
    .admin-selected { background: #eef5fc; }
    .admin-methods { padding: 0; }
    .admin-method { display: flex; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--line); cursor: pointer; line-height: 1.45; }
    .admin-method.picked { box-shadow: inset 0 0 0 1px var(--accent); }
    .admin-method.off { opacity: .6; cursor: default; }
    .admin-section { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); }
    .admin-settings { display: grid; grid-template-columns: 160px 1fr auto; align-items: center; gap: 6px 12px; margin: 10px 0; }
    .admin-dl { display: grid; grid-template-columns: 170px 1fr; gap: 6px 12px; margin: 0; }
    .admin-dl dt { color: var(--muted); }
    .admin-dl dd { margin: 0; }
    .admin-group-box { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; padding-left: 12px; border-left: 2px solid #c7d4e5; }

    .phone { display: flex; gap: 16px; padding: 16px; align-items: flex-start; flex-wrap: wrap; }
    .phone-pad { width: 300px; display: flex; flex-direction: column; gap: 12px; padding: 16px; background: #fff; border: 1px solid var(--line); border-radius: 12px; }
    .phone-title { margin: 0; font-size: 18px; }
    .phone-numbers summary { cursor: pointer; color: var(--accent); font-size: 13px; }
    .phone-numbers button { display: block; margin: 4px 0; font-size: 13px; }
    .phone-ivr { padding: 10px; background: #f5f7fa; border-radius: 8px; }
    .phone-says { margin: 0 0 6px; font-style: italic; }
    .phone-says span { margin-right: 6px; padding: 1px 6px; border-radius: 4px; background: var(--brand); color: #fff; font-style: normal; font-size: 11px; }
    .phone-note { margin: 0; font-size: 12px; }
    .phone-log { flex: 1; min-width: 320px; display: flex; flex-direction: column; gap: 12px; }
    .phone-call { padding: 12px 16px; background: #fff; border: 1px solid var(--line); border-radius: 8px; }
    .phone-call-head { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
    .phone-badge { padding: 2px 8px; border-radius: 10px; background: #e6f4ea; color: #1d5b33; font-size: 12px; font-weight: 600; }
    .phone-badge.stop { background: #fde7e9; color: #8a1d24; }
    .phone-steps { margin: 8px 0 0; padding-left: 20px; line-height: 1.6; }
    .phone-steps li.stop { color: #8a1d24; }
    .phone-time { display: flex; gap: 8px; }
    .phone-time > * { flex: 1; }
    .phone-badge.other { background: #fff4ce; color: #6b5300; }
    .phone-caller { margin: 8px 0 0; font-style: italic; }
    .phone-caller span { margin-right: 6px; padding: 1px 6px; border-radius: 4px; background: #5b3d8a; color: #fff; font-style: normal; font-size: 11px; }

    /* The clock (header) and the agent view */
    .clock { display: inline-flex; align-items: center; gap: 6px; padding: 2px 4px 2px 10px; border: 1px solid #8a9bb5; border-radius: 12px; }
    .clock-time { font-weight: 600; font-variant-numeric: tabular-nums; min-width: 104px; }
    .clock select, .clock input { font: inherit; font-size: 12px; padding: 1px 2px; border-radius: 4px; border: 1px solid #8a9bb5; background: var(--brand); color: #fff; }
    .clock-jump { display: inline-flex; gap: 4px; }
    .agent { display: flex; gap: 16px; padding: 16px; align-items: flex-start; flex-wrap: wrap; }
    .agent-side { width: 300px; display: flex; flex-direction: column; gap: 12px; padding: 16px; background: #fff; border: 1px solid var(--line); border-radius: 12px; }
    .agent-queues p { margin: 4px 0 0; }
    .agent-main { flex: 1; min-width: 320px; display: flex; flex-direction: column; gap: 12px; }
    .agent-offer { padding: 12px 16px; background: #eef5fc; border: 2px solid var(--accent); border-radius: 8px; }
    .agent-offer p { margin: 4px 0 8px; }

    .learn-license { color: var(--muted); font-size: 12px; }
    .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

    /* Classes (phase 8) and the guided tour */
    .training-env button.training-class { border-color: #f2c14e; }
    .picker-class { padding: 4px 12px 10px; background: #fffbea; border: 1px solid #ecdca8; border-radius: 8px; }
    .trainer { position: fixed; inset: 0; z-index: 900; overflow: auto; padding: 24px; background: #f3f4f6; }
    .trainer-head { display: flex; justify-content: space-between; align-items: center; max-width: 1100px; margin: 0 auto; }
    .trainer-body { max-width: 1100px; margin: 12px auto; padding: 16px 20px; background: #fff; border: 1px solid var(--line); border-radius: 12px; }
    .trainer-pick { display: flex; flex-direction: column; max-height: 50vh; overflow: auto; margin-bottom: 12px; }
    .trainer-code { padding: 2px 8px; border-radius: 6px; background: var(--brand); color: #fff; font-weight: 700; letter-spacing: .12em; }
    .trainer-body code { word-break: break-all; }
    .trainer-table { width: 100%; border-collapse: collapse; margin: 12px 0; font-size: 13px; }
    .trainer-table th, .trainer-table td { padding: 6px 8px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
    .trainer-table td.done { background: #e6f4ea; }
    .trainer-table td.busy { background: #fffbea; }
    .trainer-manage { margin: 12px 0; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; background: #f9fafb; }
    .trainer-status { margin: 0 0 8px; color: #166534; }
    .trainer-status-off { color: #9a3412; }
    .trainer-manage-row { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 8px; }
    .trainer-delete { color: #b91c1c; }
    .trainer-head-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    .trainer-sub { margin: 20px 0 6px; font-size: 15px; }
    .trainer-link-field { flex: 1 1 360px; }
    .trainer-list td { vertical-align: middle; }
    .trainer-list td:last-child { white-space: nowrap; }
    .tour { position: fixed; z-index: 950; bottom: 140px; left: 50%; transform: translateX(-50%); width: min(640px, calc(100% - 32px)); display: flex; flex-direction: column; gap: 8px; padding: 14px 18px 12px; background: var(--brand); color: #fff; border-radius: 12px; box-shadow: 0 12px 40px rgba(0, 0, 0, .35); }
    .tour-progress { display: flex; gap: 4px; }
    .tour-segment { flex: 1; height: 3px; border-radius: 2px; background: rgba(255, 255, 255, .25); overflow: hidden; }
    .tour-segment span { display: block; height: 100%; background: #f2c14e; }
    .tour-caption p { margin: 0; }
    .tour-title { font-weight: 700; font-size: 16px; }
    .tour-text { margin-top: 4px !important; line-height: 1.45; color: #dbe3ee; }
    .tour-controls { display: flex; gap: 6px; align-items: center; justify-content: flex-end; }
    .tour-count { margin-right: auto; font-size: 12px; color: #b8c4d6; }
    .tour-controls button { min-width: 32px; padding: 2px 8px; border: 1px solid #8a9bb5; border-radius: 4px; background: transparent; color: #fff; cursor: pointer; font: inherit; }
    .tour-controls button:disabled { opacity: .4; cursor: default; }
    .tour-focus { outline: 3px solid #f2c14e !important; outline-offset: -3px; box-shadow: 0 0 0 9999px rgba(15, 23, 42, .35); position: relative; z-index: 940; }

    /* Scenarios: "Fix the broken contact center" and "Where does this call go?" */
    .training-env button.training-choose { background: #f2c14e; border-color: #f2c14e; color: var(--brand); font-weight: 600; }
    .training-env button.training-choose:hover { background: #f6d27a; }
    .scenario-brief { margin: 14px 0 10px; line-height: 1.45; }
    .scenario-progress { margin-top: 12px; }
    .scenario-caller { font-style: italic; }
    .scenario-facts { margin: 0 0 8px; padding-left: 18px; color: var(--muted); font-size: 13px; line-height: 1.5; }
    .scenario-steps summary { cursor: pointer; color: var(--accent); font-size: 13px; }
    .scenario-steps .phone-steps { font-size: 13px; line-height: 1.5; }
    .scenario-checks { list-style: none; margin: 6px 0 0 26px; padding: 0; font-size: 13px; line-height: 1.5; }
    .scenario-checks li.ok { color: #2c5e3b; }
    .scenario-ai-hint { border-left: 3px solid #5b3d8a; }
    .interview { margin-top: 12px; padding: 10px 12px; background: #f7f5fb; border: 1px solid #ddd5ec; border-radius: 8px; }
    .interview-who { margin: 0 0 4px; font-weight: 600; }
    .interview-q { margin: 8px 0 2px; font-weight: 600; font-size: 13px; }
    .interview-a { margin: 2px 0; font-style: italic; line-height: 1.45; }
    .interview-label { margin: 10px 0 4px; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
    .interview-asks { display: flex; flex-direction: column; gap: 4px; }
    .interview-ask { text-align: left; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: #fff; font: inherit; font-size: 13px; cursor: pointer; }
    .interview-ask:hover { border-color: var(--accent); }
    .interview-own { display: flex; gap: 6px; margin-top: 8px; }
    .lesson-tasks > li.missed { background: #fdf3f4; border-color: #f1c9cd; }
    li.missed .lesson-mark { background: #c4314b; border-color: #c4314b; }
    .picker { max-width: 640px; }
    .picker-kind h3 { margin: 16px 0 6px; font-size: 15px; }
    .picker-level { margin: 0 0 10px; }
    .picker-level-name { margin: 0 0 4px; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
    .picker-item { display: flex; justify-content: space-between; gap: 12px; width: 100%; margin: 0 0 4px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: #fff; font: inherit; text-align: left; cursor: pointer; }
    .picker-item:hover { border-color: var(--accent); }
    .picker-item.current { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
    .picker-item em { color: var(--muted); font-size: 12px; white-space: nowrap; }
    .picker-ai { margin-top: 12px; }

    .learn { flex: none; display: flex; gap: 24px; align-items: flex-start; padding: 10px 16px; max-height: 150px; overflow: auto; background: #fff; border-top: 1px solid var(--line); font-size: 13px; }
    .learn-summary { flex: 0 0 32%; line-height: 1.45; }
    .learn-quote { flex: 1; margin: 0; padding-left: 12px; border-left: 3px solid var(--accent); line-height: 1.45; color: #2b3138; }
    .learn-status { display: block; margin-top: 4px; font-size: 12px; color: #2c5e3b; }
    .learn-status.offline { color: #5d6670; }
    .learn-status.changed { color: #8a5a00; }
    .learn-quote cite { display: block; margin-top: 4px; font-style: normal; color: var(--muted); }

    @media (max-width: 900px) {
      .training-body { flex-direction: column; }
      .lesson { width: auto; max-height: 40vh; border-right: 0; border-bottom: 1px solid var(--line); }
      .admin-sitemap { width: 140px; }
      .learn { flex-direction: column; gap: 6px; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
</body>
</html>
